# Full BFF (aggregator) — the contract the training companion talks to.
spring.application.name=training-bff
server.port=8081

# commercetools credentials, read from the gitignored .env by spring-dotenv.
ctp.project-key=${CTP_PROJECT_KEY}
ctp.client-id=${CTP_CLIENT_ID}
ctp.client-secret=${CTP_CLIENT_SECRET}
ctp.auth-url=${CTP_AUTH_URL}
ctp.api-url=${CTP_API_URL}
ctp.store-key=${CTP_STORE_KEY:}

# Swagger UI at http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Training progress tracking. Participant identity from .env; progress persisted to a
# commercetools Custom Object (container "training-progress"). Use "memory" for a local store.
training.participant-id=${PARTICIPANT_ID:local}
training.participant-name=${PARTICIPANT_NAME:Local Participant}
training.progress-store=${TRAINING_PROGRESS_STORE:ct}
