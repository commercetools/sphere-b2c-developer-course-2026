# Standalone config for the `training` module.
spring.application.name=training
server.port=8084

# training makes no commercetools calls yet, but shares the same credential contract
# so it can run inside the aggregator without extra config.
ctp.project-key=${CTP_PROJECT_KEY:}
ctp.client-id=${CTP_CLIENT_ID:}
ctp.client-secret=${CTP_CLIENT_SECRET:}
ctp.auth-url=${CTP_AUTH_URL:https://auth.europe-west1.gcp.commercetools.com}
ctp.api-url=${CTP_API_URL:https://api.europe-west1.gcp.commercetools.com}
ctp.store-key=${CTP_STORE_KEY:}
